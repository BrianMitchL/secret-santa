name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-js:
    name: Check JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install
        uses: ./.github/actions/install
      - run: npm run check:js
  check-format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install
        uses: ./.github/actions/install
      - run: npm run check:js
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install
        uses: ./.github/actions/install
      - run: npm run build
